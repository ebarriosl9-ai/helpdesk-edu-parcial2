[project]
name = "helpdesk-edu"
version = "0.5.0"
description = "Proyecto HelpDesk EDU - Segundo Parcial Programacion II (Semanas 7-11)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
